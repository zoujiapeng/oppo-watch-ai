<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>dsh-liquid-glass-siri · preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b0d12;color:#e8ecf3;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}

  /* ── a fake DSH workspace behind the surface, so backdrop-filter has
        something real to blur (this is what the plugin will sit on top of) ── */
  #fake{position:fixed;inset:0;display:grid;grid-template-columns:248px 1fr;
    background:linear-gradient(160deg,#111621,#0a0c12 60%)}
  #fake aside{border-right:1px solid rgba(255,255,255,.07);padding:14px 12px;display:flex;
    flex-direction:column;gap:7px;background:rgba(255,255,255,.02)}
  #fake aside .logo{font-weight:700;font-size:14px;letter-spacing:.01em;margin-bottom:8px;opacity:.9}
  #fake aside .row{height:30px;border-radius:8px;background:rgba(255,255,255,.05);
    display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:#aab3c4}
  #fake aside .row.on{background:rgba(120,150,255,.16);color:#dbe4ff}
  #fake main{padding:22px 26px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
  #fake main .h{font-size:15px;font-weight:600;opacity:.85}
  #fake main .msg{max-width:620px;padding:12px 15px;border-radius:14px;font-size:13.5px;line-height:1.6;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);color:#c3cbd9}
  #fake main .msg.me{align-self:flex-end;background:rgba(120,150,255,.14);border-color:rgba(120,150,255,.2)}
  #fake main .composer{margin-top:auto;height:62px;border-radius:18px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
    display:flex;align-items:center;padding:0 16px;color:#7c879b;font-size:13px}

  /* ── preview controls (hidden with H) ── */
  #panel{position:fixed;left:10px;top:10px;z-index:2147483000;width:286px;max-height:94vh;overflow:auto;
    padding:12px 13px;border-radius:14px;background:rgba(10,12,18,.9);
    border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);
    font-size:11.5px;line-height:1.5}
  #panel.hidden{display:none}
  #panel h1{font-size:12.5px;margin-bottom:8px;letter-spacing:.02em}
  #panel label{display:grid;grid-template-columns:84px 1fr 40px;gap:7px;align-items:center;margin:3px 0}
  #panel label span{opacity:.72;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #panel output{text-align:right;opacity:.6;font-variant-numeric:tabular-nums}
  #panel input[type=range]{width:100%;height:14px}
  #panel .btns{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 4px}
  #panel button{padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.07);color:#e8ecf3;font:inherit;cursor:pointer}
  #panel button.on{background:#5b7cfa;border-color:#5b7cfa;color:#fff}
  #panel .sep{height:1px;background:rgba(255,255,255,.1);margin:9px 0}
  #panel .note{opacity:.5;font-size:10.5px}
  #err{position:fixed;left:10px;bottom:10px;z-index:2147483001;max-width:520px;padding:9px 12px;
    border-radius:9px;background:rgba(190,40,30,.94);color:#fff;font:11.5px/1.5 ui-monospace,monospace;
    white-space:pre-wrap;display:none}
</style>
</head>
<body>
<div id="fake">
  <aside>
    <div class="logo">DeepSeek Harness</div>
    <div class="row on">今天的会话</div>
    <div class="row">液态玻璃调参</div>
    <div class="row">shader 实验</div>
    <div class="row">手表端联调</div>
  </aside>
  <main>
    <div class="h">conversation / default</div>
    <div class="msg me">帮我看看这颗水晶球的折射够不够通透。</div>
    <div class="msg">已按 iOS 26 的液态玻璃参数重算：折射带 0.62、色差 0.055、上半黑镜 0.78。球体边缘的水波会随音量呼吸。</div>
    <div class="composer">给 DeepSeek 发消息…</div>
  </main>
</div>

<div id="panel">
  <h1>dsh-liquid-glass-siri · preview</h1>
  <div class="btns" id="states"></div>
  <label><span>level</span><input id="level" type="range" min="0" max="1" step="0.01" value="0.35"><output>0.35</output></label>
  <div class="sep"></div>
  <div id="sliders"></div>
  <div class="sep"></div>
  <div class="btns">
    <button id="caption">示例字幕</button>
    <button id="launcher">关闭球体</button>
    <button id="hide">隐藏面板 (H)</button>
  </div>
  <div class="note">Alt+S 开关；Esc 关闭。面板隐藏后即为真实观感。</div>
</div>
<div id="err"></div>

<script>
// ── Module-loader stub: the exact registration shape the DSH web frontend
//    uses, so the preview exercises the real lib/client.js artifact. ──
window.__ModuleLoader__ = {
  load: function (def) {
    if (def.id !== 'dsh-liquid-glass-siri') {
      throw new Error('unexpected module id: ' + def.id);
    }
    var mod = def.factory(function (name) {
      throw new Error('preview: require("' + name + '") is not supported');
    });
    window.__PREVIEW__ = mod;
  }
};
</script>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('err');
  box.style.display = 'block';
  box.textContent = String(e.message) + '\n' + (e.filename || '') + ':' + (e.lineno || '');
});
</script>
<script src="../lib/client.js"></script>
<script>
(function () {
  var CONFIG = {
    autoListen: false,
    continuous: false,
    speakReplies: false,
    launcher: true,
  };

  // Minimal stand-ins for the DSH client services the surface touches.
  var fakeSpeech = { transcribe: function () { return Promise.resolve({ ok: true, value: { text: '' } }); } };
  var services = {
    uiSession: {
      adapter: {
        current: { getSnapshot: function () { return { props: { sessionId: 'preview-session' } }; } }
      }
    },
    remote: { speech: fakeSpeech },
    sessions: { retain: function () { throw new Error('preview: no sessions'); } },
  };
  var disposers = [];
  var ctx = {
    logger: { info: function () { /* console.log.apply(console, arguments) */ } },
    get: function (name) { return services[name]; },
    inject: function (names, cb) {
      var scoped = { remote: { speech: fakeSpeech } };
      var d = cb(scoped);
      if (typeof d === 'function') disposers.push(d);
    },
    effect: function (fn) { disposers.push(fn()); },
  };

  var plugin = window.__PREVIEW__;
  if (!plugin || typeof plugin.apply !== 'function') {
    throw new Error('client.js did not export apply()');
  }
  plugin.apply(ctx, CONFIG);
  var surface = plugin.surface;
  if (!surface) throw new Error('client.js did not expose surface');

  var params = surface.params;
  var renderer = surface.renderer;
  surface.open();
  surface.setState('listening');
  surface.setDebugLevel(0.35);

  // ── controls ──────────────────────────────────────────────────────
  var SLIDERS = [
    ['scale', 0.30, 0.95, 0.005],
    ['refraction', 0.0, 0.9, 0.005],
    ['band', 0.05, 1.2, 0.01],
    ['dome', 0.0, 1.2, 0.01],
    ['aberration', 0.0, 0.2, 0.001],
    ['topDarken', 0.0, 1.0, 0.01],
    ['black0', -1.6, 0.2, 0.01],
    ['black1', -1.2, 0.6, 0.01],
    ['edgeBleed', 0.0, 0.6, 0.005],
    ['brightness', 0.4, 2.0, 0.01],
    ['fx', 0.0, 2.0, 0.01],
  ];
  var host = document.getElementById('sliders');
  SLIDERS.forEach(function (spec) {
    var key = spec[0], min = spec[1], max = spec[2], step = spec[3];
    var label = document.createElement('label');
    var name = document.createElement('span'); name.textContent = key;
    var input = document.createElement('input');
    input.type = 'range'; input.min = min; input.max = max; input.step = step;
    input.value = params[key];
    var out = document.createElement('output'); out.textContent = Number(params[key]).toFixed(3);
    input.addEventListener('input', function () {
      params[key] = parseFloat(input.value);
      out.textContent = Number(params[key]).toFixed(3);
    });
    label.appendChild(name); label.appendChild(input); label.appendChild(out);
    host.appendChild(label);
  });

  var level = document.getElementById('level');
  var levelOut = level.nextElementSibling;
  level.addEventListener('input', function () {
    surface.setDebugLevel(parseFloat(level.value));
    levelOut.textContent = Number(level.value).toFixed(2);
  });

  var STATES = ['idle', 'listening', 'thinking', 'speaking'];
  var stateHost = document.getElementById('states');
  var stateBtns = STATES.map(function (s) {
    var b = document.createElement('button');
    b.textContent = s;
    b.addEventListener('click', function () {
      surface.setState(s);
      stateBtns.forEach(function (o) { o.classList.toggle('on', o === b); });
    });
    if (s === 'listening') b.classList.add('on');
    stateHost.appendChild(b);
    return b;
  });

  document.getElementById('caption').addEventListener('click', function () {
    surface.setCaption('帮我看看这颗水晶球的折射够不够通透。',
      '按 iOS 26 的液态玻璃参数重算过了：折射带 0.62、色差 0.055、上半黑镜 0.78，边缘保留了赤道亮线和底部反光弧。', false);
  });
  document.getElementById('launcher').addEventListener('click', function () {
    if (surface.open) surface.close(); else surface.open();
  });
  var panel = document.getElementById('panel');
  document.getElementById('hide').addEventListener('click', function () { panel.classList.add('hidden'); });
  window.addEventListener('keydown', function (e) {
    if (e.key === 'h' || e.key === 'H') panel.classList.toggle('hidden');
  });

  // ── pixel readback: composite the two WebGL canvases over the surface's
  //    own backdrop colour and POST the PNG to the preview server, so the orb
  //    can be inspected without a system screenshot. ──
  var shotSeq = 0;
  var shotTimer = 0;
  function uploadComposite(label) {
    if (!renderer || typeof renderer.capture !== 'function') return;
    renderer.capture(function () {
      var orb = document.querySelector('.dslgs-orb');
      var fx = document.querySelector('.dslgs-fx');
      var w = orb.width, h = orb.height;
      var out = document.createElement('canvas');
      out.width = w; out.height = h;
      var g = out.getContext('2d');
      var grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#141a26');
      grad.addColorStop(0.55, '#0a0c12');
      grad.addColorStop(1, '#080a10');
      g.fillStyle = grad;
      g.fillRect(0, 0, w, h);
      g.drawImage(orb, 0, 0, w, h);
      // The light effects sit ABOVE the ball with screen blending in the real
      // DOM, so the preview composites them the same way.
      if (fx && fx.width) {
        // The fx canvas is inset 19% of the wrapper in the real DOM (it covers
        // the ball only), so honour that geometry here too.
        g.globalCompositeOperation = 'screen';
        var fxW = fx.width, fxH = fx.height;
        var scale = (w * 0.62) / fxW;
        g.drawImage(fx, w * 0.19, h * 0.19, fxW * scale, fxH * scale);
        g.globalCompositeOperation = 'source-over';
      }
      out.toBlob(function (blob) {
        shotSeq++;
        var name = (label || 'auto') + '-' + String(shotSeq).padStart(3, '0');
        fetch('/shot?label=' + encodeURIComponent(name), { method: 'POST', body: blob })
          .catch(function () {});
      }, 'image/png');
    });
  }
  function scheduleShot(label) {
    if (shotTimer) clearTimeout(shotTimer);
    shotTimer = setTimeout(function () { uploadComposite(label); }, 350);
  }
  window.__SHOT__ = uploadComposite;
  stateBtns.forEach(function (b) {
    b.addEventListener('click', function () { scheduleShot('state-' + b.textContent); });
  });
  host.addEventListener('input', function () { scheduleShot('tune'); });
  level.addEventListener('input', function () { scheduleShot('level'); });
  setTimeout(function () { uploadComposite('boot'); }, 900);

  // ── dev loop: when lib/client.js changes on disk, reload so the next
  //    iteration is picked up without touching the device. Driven from
  //    requestAnimationFrame because a virtual-display tab throttles timers
  //    (the WebGL loop keeps running, so rAF is the reliable clock). ──
  var lastSig = null;
  var lastPoll = 0;
  (function poll() {
    requestAnimationFrame(poll);
    var now = performance.now();
    if (now - lastPoll < 1200) return;
    lastPoll = now;
    fetch('/sig', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (sig) {
      if (lastSig !== null && sig !== lastSig) location.reload();
      lastSig = sig;
    }).catch(function () {});
  })();

  window.__PREVIEW_SURFACE__ = surface;
})();
</script>
</body>
</html>
