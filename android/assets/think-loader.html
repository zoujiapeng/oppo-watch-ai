<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>think-loader</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="capsule-loader-engine.js"></script>
<script>
(function () {
  var canvas = document.getElementById("c");
  var eng = new CapsuleEngine(canvas, { mode: "pulse", speed: 1, autoStart: false });
  var NAMES = ["pulse", "chain", "helix", "orbit", "morph", "comet", "magnet", "hop", "ripple"];
  var cur = -1;

  /* 服务端传进来的是「球在窗口里的归一化几何」：中心 + 半宽/半高 */
  window.setBall = function (nx, ny, rx, ry) {
    var W = window.innerWidth || 1, H = window.innerHeight || 1;
    eng.setRect((nx - rx) * W, (ny - ry) * H, 2 * rx * W, 2 * ry * H);
  };
  window.setLoader = function (mode, speed) {
    var m = Math.max(1, Math.min(9, mode | 0));
    if (m !== cur) { eng.setMode(NAMES[m - 1]); cur = m; }
    eng.setSpeed(speed);
  };
  window.play = function () { eng.play(); };
  window.pause = function () { eng.pause(); };
  window.addEventListener("resize", function () { eng.resize(); });
})();
</script>
</body>
</html>
