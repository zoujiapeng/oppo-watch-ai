<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>设置</title>
<style>
  :root{
    --fs: 2.72vmin;                /* 全部尺寸跟着屏幕走，保证一屏装下 */
    --bg:#0b0b0d; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --txt:#e8e8ee; --dim:#8b8b95; --acc:#5b9dff; --ok:#34c759;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font:var(--fs)/1.32 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;
    user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(2px + env(safe-area-inset-top)) 4px calc(2px + env(safe-area-inset-bottom));
    gap:3px}

  /* ── 顶栏 ── */
  header{display:flex;align-items:center;gap:5px;padding:0 2px;flex:none;height:2.3em}
  header b{font-size:1.12em;letter-spacing:.02em}
  header a{color:var(--acc);text-decoration:none;font-size:1.15em;padding:0 3px}
  header #stat{margin-left:auto;font-size:.86em;color:var(--dim);white-space:nowrap}
  header #stat i{font-style:normal;color:var(--ok)}

  /* ── 面板 ── */
  .p{background:var(--card);border:1px solid var(--line);border-radius:.55em;
    padding:.38em .45em .45em;min-height:0;display:flex;flex-direction:column;gap:.26em}
  .ph{display:flex;align-items:center;gap:.35em;font-size:.86em;color:var(--dim);
    letter-spacing:.04em;flex:none;padding-bottom:.1em}
  .ph em{font-style:normal;color:var(--txt);letter-spacing:0;font-size:1.05em}
  .ph .sp{margin-left:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px;flex:1;min-height:0}
  .col{display:flex;flex-direction:column;gap:3px;min-height:0}
  .col>.p{flex:1;justify-content:space-between}

  /* ── 控件 ── */
  .row{display:flex;align-items:center;gap:.34em;flex:none;font-size:.94em;min-height:1.55em}
  .row label{flex:none;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d2}
  .row output{flex:none;min-width:2.5em;text-align:right;color:var(--acc);
    font-variant-numeric:tabular-nums;font-size:.92em}
  .row input[type=range]{flex:1;min-width:0;appearance:none;-webkit-appearance:none;
    height:.95em;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:.3em;border-radius:.15em;background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;
    width:.85em;height:.85em;margin-top:-.28em;border-radius:50%;background:var(--acc);
    box-shadow:0 0 0 .08em rgba(0,0,0,.45)}
  .sw{flex:none;width:2.1em;height:1.15em;border-radius:.6em;background:#3a3a40;position:relative;
    transition:background .15s}
  .sw.on{background:var(--ok)}
  .sw::after{content:"";position:absolute;top:.13em;left:.13em;width:.9em;height:.9em;border-radius:50%;
    background:#fff;transition:transform .15s}
  .sw.on::after{transform:translateX(.94em)}
  button{font:inherit;font-size:.9em;color:var(--txt);background:rgba(255,255,255,.07);
    border:1px solid var(--line);border-radius:.4em;padding:.3em .5em;line-height:1.1}
  button:active{background:rgba(255,255,255,.16)}
  button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  button.sm{padding:.22em .4em;font-size:.84em}
  .btns{display:flex;gap:.28em;flex-wrap:wrap;flex:none}
  .btns>*{flex:1;min-width:0}
  select{font:inherit;font-size:.88em;color:var(--txt);background:#1b1b20;border:1px solid var(--line);
    border-radius:.4em;padding:.2em .3em;max-width:50%}

  /* ── 动画槽 chips ── */
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.3em;flex:none}
  .chip{display:flex;flex-direction:column;align-items:flex-start;gap:.08em;
    padding:.34em .42em;border-radius:.42em;border:1px solid var(--line);
    background:rgba(255,255,255,.05);line-height:1.15;text-align:left}
  .chip b{font-size:.86em;font-weight:600;color:#fff;white-space:nowrap}
  .chip span{font-size:.78em;color:var(--acc);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .chip.pv{border-color:var(--acc);background:rgba(91,157,255,.16)}
  .params{display:grid;grid-template-columns:1fr 1fr;gap:0 .5em;flex:none}
  .rows{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;min-height:0}

  /* ── 选择动画的浮层 ── */
  #pick{position:fixed;inset:0;background:#0a0a0c;display:none;z-index:40;
    padding:6px;flex-direction:column;gap:4px}
  #pick.on{display:flex}
  #pick .ph{font-size:.9em;color:#fff;display:flex;align-items:center}
  #pick .list{flex:1;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:3px;
    align-content:start}
  #pick .list button{text-align:left;padding:.4em .45em;font-size:.86em;
    background:#1e1e24;border:1px solid rgba(255,255,255,.13)}
  #pick .list button.on{background:#25436e;border-color:var(--acc)}
  #pick .list button small{display:block;color:var(--dim);font-size:.82em;margin-top:.1em}

  footer{display:flex;gap:.28em;flex:none}
  footer button{flex:1;min-width:0}
  .hint{font-size:.8em;color:var(--dim);flex:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="index.html">‹</a><b>设置</b>
    <span id="stat">…</span>
  </header>

  <section class="p">
    <div class="ph"><em>动画总控</em><span>每状态一套</span>
      <span class="sp"></span><i class="sw on" id="swMaster"></i></div>
    <div class="slots" id="slots"></div>
    <div class="row"><label>球现在</label><span id="sceneNow" style="flex:1;text-align:right;opacity:.85">—</span></div>
    <div class="row">
      <label>动画库</label><select id="animSel"></select>
      <button class="sm" id="btnPrev" style="flex:none">▶ 预览</button>
      <button class="sm" id="btnPrevStop" style="flex:none">■</button>
    </div>
    <div class="params" id="aparams"></div>
  </section>

  <div class="grid2">
    <div class="col">
      <section class="p"><div class="ph"><em>球体</em></div><div id="ballRows" class="rows"></div></section>
      <section class="p"><div class="ph"><em>悬浮</em><span class="sp"></span><i class="sw" id="swFloat"></i></div>
        <div class="btns" id="srcBtns"><button data-src="0">录屏</button><button data-src="1">Root</button></div>
        <div class="btns" id="scaleBtns"><button data-scale="1">1/1</button><button data-scale="2">1/2</button><button data-scale="4">1/4</button></div>
        <div class="row"><label>低延迟</label><span style="flex:1"></span><i class="sw" id="swLowLat"></i></div>
        <div class="row"><label>Siri 形变</label><span style="flex:1"></span><i class="sw" id="swSiri"></i></div>
        <div class="row"><label>跟随对话（镜像）</label><span style="flex:1"></span><i class="sw" id="swMirror"></i></div>
      </section>
      <section class="p"><div class="ph"><em>屏幕</em></div><div id="screenRows" class="rows"></div>
        <div class="btns"><button class="sm" id="btnLock">锁定</button><button class="sm" id="btnUnlock">解锁</button></div>
      </section>
    </div>
    <div class="col">
      <section class="p"><div class="ph"><em>玻璃</em></div><div id="glassRows" class="rows"></div></section>
      <section class="p"><div class="ph"><em>文字</em></div><div id="textRows" class="rows"></div>
        <div class="btns"><button class="sm" id="btnMd">预览排版</button><button class="sm" id="btnMdStop">停</button></div>
      </section>
      <section class="p"><div class="ph"><em>语音</em><span id="vmLine" class="sp">…</span></div>
        <div class="btns"><button class="sm" id="vmOn">启用</button><button class="sm" id="vmOff">停用</button><button class="sm" id="vmRst">重启</button></div>
        <div class="btns"><button class="sm" id="vmHide">隐身</button><button class="sm" id="vmShow">显形</button><button class="sm" id="vmCal">校准</button></div>
      </section>
    </div>
  </div>

  <footer>
    <button class="sm" id="btnSaveP">存预设</button>
    <button class="sm" id="btnLoadP">预设</button>
    <button class="sm" id="btnShot">球截图</button>
    <button class="sm" id="btnSearch">搜索框</button>
    <button class="sm" id="btnVib">震动</button>
  </footer>
</div>

<div id="pick">
  <div class="ph"><em id="pickTitle" style="color:#fff">选择动画</em>
    <span class="sp"></span><button class="sm" id="pickClose">关闭</button></div>
  <div class="list" id="pickList"></div>
</div>

<script>
(function () {
  var W = window.Watch;
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  };
  function safe(fn, d) { try { return fn(); } catch (e) { return d; } }
  function each(sel, fn) {
    var l = document.querySelectorAll(sel);
    for (var i = 0; i < l.length; i++) fn(l[i]);
  }

  // ── 顶栏：型号 / 电量 ──
  function topbar() {
    if (!W) { $('stat').textContent = '浏览器预览（无 App 桥）'; return; }
    var i = safe(function () { return JSON.parse(W.getInfo()); }, {}) || {};
    $('stat').innerHTML = (i.model || '?') + ' · <i>' + Math.round(i.battery || 0) + '%</i>';
  }

  // ── 一行滑杆 / 开关 ──
  function slider(parent, label, min, max, step, val, fmt, onInput) {
    var row = el('div', 'row');
    row.appendChild(el('label', null, label));
    var r = el('input'); r.type = 'range';
    r.min = min; r.max = max; r.step = step; r.value = val;
    var out = el('output', null, fmt(val));
    r.addEventListener('input', function () {
      var v = parseFloat(r.value);
      out.textContent = fmt(v);
      onInput(v);
    });
    row.appendChild(r); row.appendChild(out);
    parent.appendChild(row);
    return r;
  }
  function switchRow(parent, label, on, cb) {
    var row = el('div', 'row');
    row.appendChild(el('label', null, label));
    var sp = el('span'); sp.style.flex = '1'; row.appendChild(sp);
    var s = el('i', 'sw' + (on ? ' on' : ''));
    s.addEventListener('click', function () {
      var v = !s.classList.contains('on');
      s.classList.toggle('on', v);
      cb(v);
    });
    row.appendChild(s);
    parent.appendChild(row);
    return s;
  }

  // ══════════════════ 动画总控 ══════════════════
  var AN = null, pvSlot = 'thinking', selAnim = 'wave';

  function animName(id) {
    if (!AN) return id;
    for (var i = 0; i < AN.animations.length; i++)
      if (AN.animations[i].id === id) return AN.animations[i].name;
    return id === 'off' ? '关闭' : id;
  }
  function animDef(id) {
    for (var i = 0; i < AN.animations.length; i++)
      if (AN.animations[i].id === id) return AN.animations[i];
    return null;
  }
  function slotDef(id) {
    for (var i = 0; i < AN.slots.length; i++)
      if (AN.slots[i].id === id) return AN.slots[i];
    return null;
  }
  function fmtParam(p, v) {
    switch (p.fmt) {
      case 'pct': return (v / 100).toFixed(2);
      case 'pct2': return (v / 100).toFixed(2);
      case 'px': return Math.round(v) + 'px';
      case 'deg': return Math.round(v) + '°';
      case 'ny': return (v / 100).toFixed(2);
      case 'count': return String(Math.round(v));
      case 'mode': return ['纯白', '单色', '混色'][v] || String(v);
      case 'onoff': return v ? '沉底' : '普通';
      default: return String(v);
    }
  }

  function animLoad() {
    if (!W) return;
    AN = safe(function () { return JSON.parse(W.animCatalog()); }, null);
    if (!AN || !AN.slots || !AN.slots.length) {
      $('slots').innerHTML = '<div class="hint">动画目录读不到</div>';
      return;
    }
    $('swMaster').classList.toggle('on', !!safe(function () { return W.animMaster(); }, true));
    renderSlots();
    renderAnimSelect();
    renderParams();
  }

  function renderSlots() {
    var box = $('slots'); box.innerHTML = '';
    AN.slots.forEach(function (s) {
      var b = el('button', 'chip' + (s.id === pvSlot ? ' pv' : ''));
      b.appendChild(el('b', null, s.name));
      b.appendChild(el('span', null, animName(AN.values[s.id])));
      b.addEventListener('click', function () { openPick(s.id); });
      box.appendChild(b);
    });
  }

  function renderAnimSelect() {
    var sel = $('animSel'); sel.innerHTML = '';
    AN.animations.forEach(function (a) {
      var o = el('option', null, a.name); o.value = a.id;
      sel.appendChild(o);
    });
    sel.value = selAnim;
    sel.onchange = function () { selAnim = sel.value; renderParams(); };
  }

  function renderParams() {
    var box = $('aparams'); box.innerHTML = '';
    var a = animDef(selAnim);
    if (!a) return;
    var vals = (AN.params && AN.params[selAnim]) || {};
    a.params.forEach(function (p) {
      var v = (typeof vals[p.k] === 'number') ? vals[p.k] : p.def;
      slider(box, p.label, p.min, p.max, p.step, v,
        function (x) { return fmtParam(p, x); },
        function (x) {
          if (AN.params[selAnim]) AN.params[selAnim][p.k] = x;
          try { W.animParam(selAnim, p.k, x); } catch (e) {}
        });
    });
    if (!a.params.length) box.appendChild(el('div', 'hint', '这个动画没有参数'));
  }

  function openPick(slotId) {
    pvSlot = slotId;
    renderSlots();
    $('pickTitle').textContent = (slotDef(slotId) || {}).name + ' · 用哪个动画';
    var list = $('pickList'); list.innerHTML = '';
    var s = slotDef(slotId) || {};
    var limited = s.ballOnly || slotId === 'search' || slotId === 'zones';
    AN.animations.forEach(function (a) {
      if (limited && !(a.id === 'off' || a.id.indexOf('cap') === 0)) return;
      var b = el('button', null, a.name);
      b.appendChild(el('small', null, a.desc));
      if (AN.values[slotId] === a.id) b.classList.add('on');
      b.addEventListener('click', function () {
        try { W.animBind(slotId, a.id); } catch (e) {}
        AN.values[slotId] = a.id;
        $('pick').classList.remove('on');
        renderSlots();
        preview(slotId);
      });
      list.appendChild(b);
    });
    $('pick').classList.add('on');
  }

  function preview(slotId) {
    pvSlot = slotId;
    try { W.animPreview(slotId); } catch (e) {}
    try { W.toast('预览 ' + (slotDef(slotId) || {}).name + '：20 秒后自动结束'); } catch (e) {}
    renderSlots();
    sceneSync();
  }

  /**
   * 球此刻到底在跑哪个槽 / 哪个动画。
   *
   * ★ 2026-11-08：这一行是给「设置对不上球」这类问题当场定位用的 ——
   *   以前设置页只能看到自己存了什么（bind.*），看不到球真的在跑什么；
   *   于是预览槽还钉在「空闲」上时，改动任何绑定都没反应，只能靠猜。
   */
  function sceneSync() {
    if (!W) return;
    var s = safe(function () { return JSON.parse(W.animState() || '{}'); }, null);
    var line = $('sceneNow');
    if (!s || !line) return;
    if (!s.running) { line.textContent = '悬浮球没开'; return; }
    var pv = s.preview ? ('预览钉住「' + ((slotDef(s.preview) || {}).name || s.preview) + '」') : '';
    line.textContent = (slotDef(s.slot) ? slotDef(s.slot).name : s.slot)
      + ' → ' + animName(s.anim) + (pv ? ' · ' + pv : '')
      + (s.master ? '' : ' · 总控已关（旧逻辑）');
  }

  $('pickClose').addEventListener('click', function () { $('pick').classList.remove('on'); });
  $('pick').addEventListener('click', function (e) { if (e.target === this) this.classList.remove('on'); });
  $('btnPrev').addEventListener('click', function () { preview(pvSlot); });
  $('btnPrevStop').addEventListener('click', function () { try { W.animPreview(''); } catch (e) {} });
  $('swMaster').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    try { W.animSetMaster(on); } catch (e) {}
  });

  // ══════════════════ 球体 / 玻璃 ══════════════════
  var GP = {};
  function glassLoad() {
    GP = safe(function () { return JSON.parse(W.getFloatParams() || '{}'); }, {}) || {};
    var d = { master: 1, posX: .5, posY: .5, halfX: .37, halfY: .25, corner: 1,
      refraction: 200, band: 170, zoom: 1, dome: .4, aberration: 10, blur: .3,
      topDarken: .93, black0: -1, black1: -.01, edgeBleed: .11 };
    for (var k in d) if (typeof GP[k] !== 'number') GP[k] = d[k];
  }
  var pushT = null;
  function glassPush() {
    clearTimeout(pushT);
    pushT = setTimeout(function () {
      try { W.setFloatParams(JSON.stringify(GP)); } catch (e) {}
    }, 60);
  }
  function glassSlider(box, label, key, min, max, step) {
    slider(box, label, min, max, step, GP[key],
      function (x) { return (step >= 1 ? Math.round(x) : x.toFixed(2)); },
      function (x) { GP[key] = x; glassPush(); });
  }
  function glassRender() {
    var b = $('ballRows'); b.innerHTML = '';
    glassSlider(b, '大小', 'master', 0.2, 1.8, 0.01);
    glassSlider(b, '宽', 'halfX', 0.10, 0.60, 0.01);
    glassSlider(b, '高', 'halfY', 0.10, 0.60, 0.01);
    glassSlider(b, '圆角', 'corner', 0, 1, 0.01);
    var g = $('glassRows'); g.innerHTML = '';
    glassSlider(g, '折射', 'refraction', 0, 400, 1);
    glassSlider(g, '带宽', 'band', 20, 400, 1);
    glassSlider(g, '放大', 'zoom', 0.5, 2.5, 0.01);
    glassSlider(g, '球面', 'dome', 0, 1, 0.01);
    glassSlider(g, '色散', 'aberration', 0, 40, 1);
    glassSlider(g, '模糊', 'blur', 0, 3, 0.01);
    glassSlider(g, '黑区', 'topDarken', 0, 1, 0.01);
    glassSlider(g, '暗边', 'edgeBleed', 0, 0.6, 0.01);
  }

  // ══════════════════ 文字 ══════════════════
  function textRender() {
    var box = $('textRows'); box.innerHTML = '';
    slider(box, '字号', 10, 100, 1, safe(function () { return W.getSiriTextSp(); }, 34),
      function (v) { return String(Math.round(v)); },
      function (v) { try { W.setSiriTextSp(v); } catch (e) {} });
    slider(box, '正文比例', 5, 120, 1, safe(function () { return W.getMdFontRatioPct(); }, 25),
      function (v) { return (v / 100).toFixed(2); },
      function (v) { try { W.setMdFontRatioPct(v); } catch (e) {} });
    slider(box, '黑区下沿', -40, 300, 1, safe(function () { return W.getSiriTextDy(); }, 10),
      function (v) { return String(Math.round(v)); },
      function (v) { try { W.setSiriTextDy(v); } catch (e) {} });
    slider(box, '安全距离', 0, 450, 5, safe(function () { return W.getSiriBlackStep(); }, 100),
      function (v) { return (v / 1000).toFixed(2); },
      function (v) { try { W.setSiriBlackStep(v); } catch (e) {} });
  }
  $('btnMd').addEventListener('click', function () { try { W.previewSiriText(); } catch (e) {} });
  $('btnMdStop').addEventListener('click', function () { try { W.previewSiriTextStop(); } catch (e) {} });

  // ══════════════════ 悬浮 / 屏幕 ══════════════════
  function floatSync() {
    $('swFloat').classList.toggle('on', !!safe(function () { return W.isFloating(); }, false));
    $('swLowLat').classList.toggle('on', !!safe(function () { return W.getFloatLowLat(); }, false));
    $('swSiri').classList.toggle('on', !!safe(function () { return W.getSiriEnabled(); }, false));
    $('swMirror').classList.toggle('on', !!safe(function () { return W.getMirrorEnabled(); }, false));
    var src = safe(function () { return W.getFloatCaptureSrc(); }, 0);
    var sc = safe(function () { return W.getFloatCapScale(); }, 2);
    each('[data-src]', function (b) { b.classList.toggle('on', +b.dataset.src === src); });
    each('[data-scale]', function (b) { b.classList.toggle('on', +b.dataset.scale === sc); });
  }
  $('swFloat').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    try { if (on) W.startFloat(); else W.stopFloat(); } catch (e) {}
    setTimeout(floatSync, 700);
  });
  $('swLowLat').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    try { W.setFloatLowLat(on); } catch (e) {}
  });
  $('swSiri').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    try { W.setSiriEnabled(on); } catch (e) {}
  });
  // 跟随对话（镜像）：球的状态（思考中/过程中回复/最终回复）就是从这条流里来的。
  // 关掉它 = 球只认得「自己提问」那一轮，你在 DSH 页面里问的话它一概不知道，
  // 表现就是「不管问什么，球一直是待机动画」。
  $('swMirror').addEventListener('click', function () {
    var on = !this.classList.contains('on');
    this.classList.toggle('on', on);
    try { W.setMirrorEnabled(on); } catch (e) {}
    setTimeout(floatSync, 700);
  });
  each('[data-src]', function (b) {
    b.addEventListener('click', function () {
      try { W.setFloatCaptureSrc(+this.dataset.src); } catch (e) {}
      floatSync();
    });
  });
  each('[data-scale]', function (b) {
    b.addEventListener('click', function () {
      try { W.setFloatCapScale(+this.dataset.scale); } catch (e) {}
      floatSync();
    });
  });

  function screenRender() {
    var box = $('screenRows'); box.innerHTML = '';
    slider(box, '亮度', 5, 100, 1, 100,
      function (v) { return Math.round(v) + '%'; },
      function (v) { try { W.setBrightness(v / 100); } catch (e) {} });
    switchRow(box, '常亮', safe(function () { return W.getKeepScreenOn(); }, true),
      function (v) { try { W.setKeepScreenOn(v); } catch (e) {} });
    switchRow(box, '开机锁定', safe(function () { return W.getAutoKiosk(); }, false),
      function (v) { try { W.setAutoKiosk(v); } catch (e) {} });
  }
  $('btnLock').addEventListener('click', function () { try { W.startKiosk(); } catch (e) {} });
  $('btnUnlock').addEventListener('click', function () { try { W.stopKiosk(); } catch (e) {} });

  // ══════════════════ 语音 ══════════════════
  function vmSync() {
    if (!W) return;
    var s = safe(function () { return JSON.parse(W.vmStatus() || '{}'); }, {}) || {};
    var on = function (v) { return v === '1' || v === 1; };
    $('vmLine').textContent = (on(s.mod) ? '模块✓' : '无模块') + ' · ' +
      (on(s.en) ? '已启用' : '未启用') + ' · ' + (s.ime || '—').split('.').pop();
  }
  $('vmOn').addEventListener('click', function () { try { W.vmEnable(''); } catch (e) {} setTimeout(vmSync, 900); });
  $('vmOff').addEventListener('click', function () { try { W.vmDisable(); } catch (e) {} setTimeout(vmSync, 900); });
  $('vmRst').addEventListener('click', function () { try { W.vmRestartIme(); } catch (e) {} setTimeout(vmSync, 1200); });
  $('vmHide').addEventListener('click', function () { try { W.vmStealth(true); } catch (e) {} });
  $('vmShow').addEventListener('click', function () { try { W.vmStealth(false); } catch (e) {} });
  $('vmCal').addEventListener('click', function () { try { W.vmCalibrate(); } catch (e) {} });
  setInterval(vmSync, 4000);

  // ══════════════════ 底栏 ══════════════════
  var PKEY = 'glass_presets';
  function presets() { return safe(function () { return JSON.parse(localStorage.getItem(PKEY)) || {}; }, {}); }
  function savePreset() {
    var o = presets(), n = 'P' + (Object.keys(o).length + 1);
    o[n] = { g: JSON.parse(JSON.stringify(GP)) };
    try { localStorage.setItem(PKEY, JSON.stringify(o)); } catch (e) {}
    try { W.toast('已存 ' + n); } catch (e) {}
  }
  function loadPreset() {
    var o = presets(), names = Object.keys(o);
    if (!names.length) { try { W.toast('没有预设'); } catch (e) {} return; }
    var n = names[names.length - 1];
    for (var k in o[n].g) GP[k] = o[n].g[k];
    glassPush(); glassRender();
    try { W.toast('已套用 ' + n); } catch (e) {}
  }
  $('btnSaveP').addEventListener('click', savePreset);
  $('btnLoadP').addEventListener('click', loadPreset);
  $('btnShot').addEventListener('click', function () {
    try { W.toast(W.captureBall() ? '已存球截图' : '截图失败'); } catch (e) {}
  });
  $('btnSearch').addEventListener('click', function () {
    try { if (W.isSearchBoxOpen()) W.closeSearchBox(); else W.openSearchBox(); } catch (e) {}
  });
  $('btnVib').addEventListener('click', function () { try { W.vibrate(60); } catch (e) {} });

  // ══════════════════ 启动 ══════════════════
  topbar();
  if (W) {
    animLoad();
    glassLoad(); glassRender();
    textRender();
    screenRender();
    floatSync();
    vmSync();
    sceneSync();
    setInterval(sceneSync, 1000);
    setInterval(floatSync, 2500);
    setInterval(topbar, 15000);
  } else {
    $('slots').innerHTML = '<div class="hint">在 App 内打开才有设置桥</div>';
  }
})();
</script>
</body>
</html>
